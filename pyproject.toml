[project]
name = "upa11y"
version = "0.1.0"
description = "Ferramenta de refatoração para acessibilidade"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "beautifulsoup4>=4.12",
  "pyqt6>=6.11.0",
  "pyqt6-qscintilla>=2.14.1",
  "qtawesome>=1.4.1",
]

[project.scripts]
upa11y = "upa11y.cli:main"
upa11y-gui = "upa11y.interface.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
